<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 72px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
}

#tinyMessage {
    position: fixed;
    font-size: 14px;
    color: white;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    opacity: 0.8;
    z-index: 11;
}

video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    visibility: hidden;
    opacity: 0; 
}
</style>
</head>

<body>

<div id="overlay">
  Tap anywhere to continue
</div>

<div id="tinyMessage">
  Click closer to see the surprise!
</div>

<video id="vid" playsinline preload="auto" loop>
  <source src="Jumpscare.mp4" type="video/mp4">
</video>

<script>
const overlay = document.getElementById("overlay");
const tinyMessage = document.getElementById("tinyMessage");
const video = document.getElementById("vid");

let firstClickDone = false;

// First click: hide main overlay, show tiny message
function firstClick() {
    overlay.style.display = "none";
    tinyMessage.style.display = "block";
    firstClickDone = true;
}

// Second click: play video at full volume, fullscreen
async function secondClick() {
    tinyMessage.style.display = "none";
    video.style.visibility = "visible";
    video.style.opacity = "1";
    video.muted = false;
    video.volume = 1.0;

    if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
    }

    try {
        await video.play();
    } catch(e) {
        console.log("Playback failed:", e);
    }
}

// Attach events
document.addEventListener("click", () => {
    if (!firstClickDone) {
        firstClick();
    } else {
        secondClick();
    }
}, {once: false});

document.addEventListener("touchstart", () => {
    if (!firstClickDone) {
        firstClick();
    } else {
        secondClick();
    }
}, {once: false});
</script>

</body>
</html>
