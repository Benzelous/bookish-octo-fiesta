<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
}

#tinyMessage {
    position: fixed;
    font-size: 8px;
    color: white;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    opacity: 0.85;
    z-index: 11;
}

video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    visibility: hidden;
    opacity: 0; 
}
</style>
</head>

<body>

<div id="overlay">
 Error 4001a - Meme_video.mov load error. 
    Click to reload page
</div>

<div id="tinyMessage">
  Didn't anyone teach you not to trust random QR codes you find lying around?
</div>

<video id="vid" playsinline preload="auto" loop>
  <source src="Jumpscare.mp4" type="video/mp4">
</video>

<script>
const overlay = document.getElementById("overlay");
const tinyMessage = document.getElementById("tinyMessage");
const video = document.getElementById("vid");

function startVideoAfterDelay(delayMs) {
    setTimeout(async () => {
        tinyMessage.style.display = "none";
        video.style.visibility = "visible";
        video.style.opacity = "1";
        video.muted = false;
        video.volume = 1.0;

        // fullscreen
        if (video.requestFullscreen) {
            video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
            video.webkitRequestFullscreen();
        }

        try {
            await video.play();
        } catch(e) {
            console.log("Playback failed:", e);
        }
    }, delayMs);
}

// First click/tap
function firstClick() {
    overlay.style.display = "none";        // hide overlay
    tinyMessage.style.display = "block";   // show tiny message
    startVideoAfterDelay(5000);           // 10 seconds delay
}

// Attach events
document.addEventListener("click", firstClick, {once: true});
document.addEventListener("touchstart", firstClick, {once: true});
</script>

</body>
</html>
