<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
}

video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    visibility: hidden;
    opacity: 0; 
}
</style>
</head>

<body>

<div id="overlay">
  Failed to load page due to Error (Err47590a) - Tap anywhere to retry again
</div>

<video id="vid" playsinline preload="auto" loop>
  <source src="Jumpscare.mp4" type="video/mp4">
</video>

<script>
const overlay = document.getElementById("overlay");
const video = document.getElementById("vid");

async function startExperience() {
    overlay.style.display = "none";   // hide overlay
    video.style.visibility = "visible"; 
    video.style.opacity = "1";
    video.muted = false;              // ensure sound plays
    video.volume = 1.0;

    // request fullscreen
    if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
    }

    try {
        await video.play();
    } catch(e) {
        console.log("Playback failed:", e);
    }
}

// Attach click/touch events once
document.addEventListener("click", startExperience, {once: true});
document.addEventListener("touchstart", startExperience, {once: true});
</script>

</body>
</html>
