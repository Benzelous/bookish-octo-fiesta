<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
    body {
        margin:0;
        background:black;
        color:white;
        font-family:Arial, sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        cursor:pointer;
    }

    #overlay {
        position:absolute;
        text-align:center;
        font-size:28px;
        opacity:0.9;
    }

    video {
        position:fixed;
        width:100%;
        height:100%;
        object-fit:cover;
        display:none;
    }
</style>
</head>

<body>

<div id="overlay">
    Cute_Video_Bunny.kek Failed to Load. Tap Anywhere to Try Again
</div>

<video id="video" playsinline>
    <source src="https://host.screamer.wiki/pictureofwinterrowd.mp4 
type="video/mp4">
</video>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");

document.body.addEventListener("click", async () => {

    overlay.style.display = "none";
    video.style.display = "block";

    video.muted = false;
    video.volume = 1.0;

    try {
        await video.play();
    } catch(e) {
        console.log("Playback blocked:", e);
    }

    // Try fullscreen (works on most phones)
    if (video.requestFullscreen) {
        video.requestFullscreen().catch(()=>{});
    }

}, { once:true });
</script>

</body>
</html>
